<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Postacie</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/postacie.css">

</head>

<body>
    <h2 class="tytuł">Postacie</h2>
    <center>
        <div class="logo-frame">
            <img class="logo logo-postacie" width="440px" src="https://res.cloudinary.com/ddqbmcmoe/image/upload/v1783178411/Dziel_si%C4%99_i_inspiruj_dbkwvx.svg" alt="Postacie">
        </div>
    </center>
    <div class="opis">
        <i>Witaj na stronie postaci Planet Zoo!<br> 
        Zebrano tutaj wszystkie postacie występujące w grze oraz w historii.<br> 
        Dowiedz się więcej na temat każdej z nich.<br>
        Życzymy miłego czytania!</i>
    </div>

    <!-- GRID POSTACIE -->
    <div id="postacie-grid" class="postacie-grid"></div>


    <!-- MODAL POSTACIE -->
    <div id="postacie-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-postacie" class="version-modal-close">✖</button>

            <!-- 🔹 GÓRNY BLOK -->
            <div id="postacie-header">
                <div id="postacie-avatar"></div>

                <div id="postacie-info">
                    <h2 id="postacie-name"></h2>
                    <p id="postacie-meta"></p>
                    <a id="postacie-link"></a>
                </div>
            </div>
            <hr class="modal-separator">
            <p id="postacie-description"></p>
            <hr class="modal-separator">
            <div id="postacie-gallery" class="postacie-gallery"></div>
            <hr class="modal-separator">
            <div id="postacie-fullDescription" style="margin-top:10px;"></div>
        </div>
    </div>


    <div id="glossary-modal" class="modal hidden">
        <div class="modal-content">
            <button class="version-modal-close" id="close-glossary">✖</button>
            <h3 id="glossary-title"></h3>
            <p id="glossary-definition"></p>
            <div id="glossary-more"></div>
            <!-- tutaj JS doda link "Więcej..." -->
        </div>
    </div>

    <!-- LIGHTBOX GALERII -->
    <div id="gallery-lightbox" class="gallery-lightbox hidden">
        <button class="gallery-close">✖</button>
        <button class="gallery-prev">◀</button>
        <img id="gallery-lightbox-img" alt="Powiększone zdjęcie" />
        <button class="gallery-next">▶</button>
    </div>

    <script src="js/glossary-modal.js"></script>
    <script src="js/glossary-detect.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/postacie.js"></script>
</body>

</html>
