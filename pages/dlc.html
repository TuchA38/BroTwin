<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>DLC</title>
    <link rel="stylesheet" href="css/dlc.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <h2 class="tytuł">DLC</h2>
    <center>
        <div class="logo-frame"><img class="logo logo-dlc" width="440px" src="https://res.cloudinary.com/ddqbmcmoe/image/upload/v1783197296/dlc_zbn7i2.webp" alt="DLC">
        </div>
    </center>
    <div class="opis"><i>Witaj na stronie DLC Planet Zoo!<br> Zebrano tutaj wszystkie dodatki do gry.<br> Dowiedz się więcej na temat każdego pakietu rozszerzeń.<br>Życzymy miłego czytania!</i></div>

    <!-- GRID DLC -->
    <div id="dlc-grid" class="dlc-grid"></div>


    <!-- MODAL DLC -->
    <div id="dlc-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-dlc" class="version-modal-close">✖</button>

            <!-- 🔹 GÓRNY BLOK -->
            <div id="dlc-header">
                <div id="dlc-trailer"></div>

                <div id="dlc-info">
                    <h2 id="dlc-name"></h2>
                    <p id="dlc-meta"></p>
                    <a id="dlc-link"></a>
                </div>
            </div>
            <hr class="modal-separator">
            <p id="dlc-description"></p>
            <hr class="modal-separator">
            <div id="dlc-gallery" class="dlc-gallery"></div>
            <hr class="modal-separator">
            <div id="dlc-fullDescription" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="glossary-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-glossary">✖</button>
            <h3 id="glossary-title"></h3>
            <p id="glossary-definition"></p>
            <div id="glossary-more"></div>
            <!-- tutaj JS doda link "Więcej..." -->
        </div>
    </div>

    <div id="gallery-lightbox" class="gallery-lightbox hidden">
        <button class="gallery-close">✖</button>
        <button class="gallery-prev">◀</button>
        <img id="gallery-lightbox-img" />
        <button class="gallery-next">▶</button>
    </div>

    <script src="js/glossary-modal.js"></script>
    <script src="js/glossary-detect.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/dlc.js"></script>
</body>

</html>
