<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>DLC</title>
    <link rel="stylesheet" href="css/historia.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <h2 class="tytuł">Historia</h2>
    <center>
        <div class="logo-frame"><img class="logo" src="https://res.cloudinary.com/ddqbmcmoe/image/upload/v1787327443/historia_vfpc1g.webp" alt="Historia">
        </div>
    </center>
    <div class="opis"><i>Witaj w Historii Planet Zoo!<br>Opisano tutaj historię powstawania naszych ogrodów zoologicznych.<br>Życzymy miłego czytania!</i></div>


    <div class="historia-page">
        <!-- Quick Navigation / Filters -->
        <div class="historia-nav-bar">
            <div id="historia-tabs" class="historia-tabs-container">
                <!-- Przyciski zakładek tworzone dynamicznie w JS -->
            </div>
        </div>

        <!-- Main Container for Zoo cards/sections -->
        <div id="historia-zoos-container" class="historia-zoos-container">
            <div class="historia-loading">Ładowanie historii ogrodów...</div>
        </div>

        <!-- Lightbox Modal (Fallback dla historii) -->
        <div id="historia-lightbox" class="gallery-lightbox hidden">
            <button id="historia-lightbox-close" class="gallery-close version-modal-close" aria-label="Zamknij">✖</button>
            <button id="historia-lightbox-prev" class="gallery-prev arrow" aria-label="Poprzednie">&#9664;</button>
            <button id="historia-lightbox-next" class="gallery-next arrow" aria-label="Następne">&#9654;</button>
            <div class="historia-lightbox-box">
                <img id="historia-lightbox-img" src="" alt="Zdjęcie z historii">
                <div id="historia-lightbox-caption" class="historia-lightbox-caption"></div>
            </div>
        </div>
    </div>

    <div id="gallery-lightbox" class="gallery-lightbox hidden">
        <button class="gallery-close version-modal-close">✖</button>
        <button class="gallery-prev arrow">&#9664;</button>
        <button class="gallery-next arrow">&#9654;</button>
        <img id="gallery-lightbox-img" src="" alt="Gallery Image">
        <video id="gallery-lightbox-video" style="transition:opacity 0.3s ease; display:none; max-width:90vw; max-height:85vh;" autoplay loop muted playsinline></video>
    </div>

    <!-- Dynamic Script Load -->
    <script src="js/historia.js"></script>


    <script src="js/glossary-modal.js"></script>
    <script src="js/glossary-detect.js"></script>
    <script src="js/gallery.js"></script>
</body>

</html>
