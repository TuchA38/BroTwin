<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Skróty Klawiszowe – Zoopedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/zoopedia.css">
    <link rel="stylesheet" href="css/skroty.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h2 class="tytuł">Skróty Klawiszowe</h2>
    <center>
        <div class="logo-frame">
            <img class="logo logo-dlc" width="440px" src="https://res.cloudinary.com/ddqbmcmoe/image/upload/v1791481385/przyciski_dtao82.webp" alt="Przyciski">
        </div>
    </center>
    <div class="opis"><i>Witaj w Skrótach klawiszowych!<br>Zebrano tutaj wszystkie pomocne skróty klawiszowe.<br>Dzięki temu możesz jeszcze bardziej usprawnić swoją grę!</i></div>

    <!-- Toast osadzony wyłącznie w obrębie podstrony skrótów -->
    <div id="shortcut-toast"></div>

    <!-- Główny kontener jednokolumnowy (Góra: Kontroler, Dół: Tabela) -->
    <div class="shortcuts-layout">

        <!-- Góra: Wizualna Klawiatura (lewo) + Myszka (prawo) -->
        <div class="visual-panel">
            <b class="panel-title">Wizualny Kontroler</b>
            <div id="controller-view"></div>
        </div>

        <!-- Dół: Tabela ze skrótami -->
        <div class="table-panel">
            <b class="panel-title">Tabela Akcji</b>
            <div id="skroty-table-container"></div>
        </div>

    </div>

    <script src="js/skroty.js"></script>
    <script>
        if (typeof window.initShortcuts === "function") {
            window.initShortcuts();
        }
    </script>
</body>

</html>
