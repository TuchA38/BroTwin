<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Skróty Klawiszowe – Zoopedia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/zoopedia.css">
    <link rel="stylesheet" href="css/skroty.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h2 class="tytuł">Skróty Klawiszowe</h2>
    <div class="opis"><i>Naciskaj klawisze na fizycznej klawiaturze, aby zobaczyć ich podświetlenie i przypisane akcje.</i></div>

    <!-- Główny kontener 2-kolumnowy -->
    <div class="shortcuts-layout">

        <!-- Lewa strona: Wizualna Klawiatura / Pad -->
        <div class="visual-panel">
            <b class="panel-title">Wizualny Kontroler</b>
            <div id="controller-view"></div>
        </div>

        <!-- Prawa strona: Tabela ze skrótami -->
        <div class="table-panel">
            <b class="panel-title">Tabela Akcji</b>
            <div id="skroty-table-container"></div>
        </div>

    </div>

    <script src="js/skroty.js"></script>
    <script>
        if (typeof window.initShortcuts === "function") {
            window.initShortcuts();
        }
    </script>
</body>

</html>
