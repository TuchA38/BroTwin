<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Miejsca</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/miejsca.css">
</head>

<body>
    <h2 class="tytuł">Miejsca</h2>
    <center>
        <div class="logo-frame">
            <img class="logo logo-miejsca" width="440px" src="https://res.cloudinary.com/ddqbmcmoe/image/upload/v1787864710/miejsca_1_svscah.webp" alt="Miejsca">
        </div>
    </center>
    <div class="opis">
        <i>Witaj na stronie miejsc Planet Zoo!<br> 
        Zebrano tutaj wszystkie miejsca występujące w grze oraz w historii.<br> 
        Dowiedz się więcej na temat każdego z nich.<br>
        Życzymy miłego czytania!</i>
    </div>

    <!-- GRID MIEJSCA -->
    <div id="miejsca-grid" class="miejsca-grid"></div>

    <!-- MODAL MIEJSCA -->
    <div id="miejsca-modal" class="modal hidden">
        <div class="modal-content">
            <button id="close-miejsca" class="version-modal-close">✖</button>

            <!-- 🔹 GÓRNY BLOK -->
            <div id="miejsca-header">
                <div id="miejsca-avatar"></div>

                <div id="miejsca-info">
                    <h2 id="miejsca-name"></h2>
                    <p id="miejsca-meta"></p>
                    <a id="miejsca-link"></a>
                </div>
            </div>
            <hr class="modal-separator">
            <p id="miejsca-description"></p>
            <hr class="modal-separator">
            <div id="miejsca-gallery" class="miejsca-gallery"></div>
            <hr class="modal-separator">
            <div id="miejsca-fullDescription" style="margin-top:10px;"></div>
        </div>
    </div>

    <div id="glossary-modal" class="modal hidden">
        <div class="modal-content">
            <button class="version-modal-close" id="close-glossary">✖</button>
            <h3 id="glossary-title"></h3>
            <p id="glossary-definition"></p>
            <div id="glossary-more"></div>
            <!-- tutaj JS doda link "Więcej..." -->
        </div>
    </div>

    <!-- LIGHTBOX GALERII -->
    <div id="gallery-lightbox" class="gallery-lightbox hidden">
        <button class="gallery-close">✖</button>
        <button class="gallery-prev">◀</button>
        <img id="gallery-lightbox-img" alt="Powiększone zdjęcie" />
        <button class="gallery-next">▶</button>
    </div>

    <script src="js/glossary-modal.js"></script>
    <script src="js/glossary-detect.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/miejsca.js"></script>
</body>

</html>
