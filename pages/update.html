<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <title>Aktualizacje Planet Zoo</title>
    <link rel="stylesheet" href="css/zoopedia.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/update.css">
</head>

<body>
    <!-- Przycisk mobilny w lewym górnym rogu -->
    <button id="update-mobile-toggle" aria-label="Otwórz listę wersji">
        ☰ Wersje
    </button>

    <!-- Overlay przyciemniający tło na telefonie -->
    <div id="update-sidebar-overlay" class="update-sidebar-overlay"></div>

    <h2 class="tytuł">Aktualizacje</h2>
    <center>
        <div class="logo-frame">
            <img class="logo" src="https://res.cloudinary.com/ddqbmcmoe/image/upload/v1787428647/aktualizacje_x5qxmz.webp" alt="Aktualizacje">
        </div>
    </center>
    <div class="opis"><i>Tutaj znajdziesz wszystkie aktualności dotyczące gry.<br>Życzymy miłego czytania!</i></div>
    <hr>

    <div id="updates-wrapper">
        <!-- Panel boczny z wersjami -->
        <div id="updates-list-container">
            <div id="update-items"></div>
        </div>

        <!-- Główny kontener treści wpisu -->
        <div id="update-content-container">
            <h2 id="update-title"></h2>
            <p id="update-meta"></p>
            <div id="update-video"></div>
            <div id="update-intro"></div>
            <div id="update-sections"></div>
            <div id="update-related"></div>
        </div>
    </div>

    <!-- Modale i Lightbox -->
    <div id="glossary-modal" class="modal hidden">
        <div class="modal-content">
            <button class="version-modal-close" id="close-glossary">✖</button>
            <h3 id="glossary-title"></h3>
            <p id="glossary-definition"></p>
            <div id="glossary-more"></div>
        </div>
    </div>

    <div id="gallery-lightbox" class="gallery-lightbox hidden">
        <button class="gallery-close version-modal-close">✖</button>
        <button class="gallery-prev arrow">&#9664;</button>
        <button class="gallery-next arrow">&#9654;</button>
        <img id="gallery-lightbox-img" src="" alt="Gallery Image">
        <video id="gallery-lightbox-video" style="transition:opacity 0.3s ease; display:none; max-width:90vw; max-height:85vh;" autoplay loop muted playsinline></video>
    </div>

    <script src="js/glossary-modal.js"></script>
    <script src="js/glossary-detect.js"></script>
    <script src="js/gallery.js"></script>
    <script src="js/update.js"></script>
</body>

</html>
